name: Deploy SecureSave to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Emscripten (emsdk)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.58

      - name: Verify Emscripten Compiler
        run: |
          emcc --version

      - name: Compile C to WebAssembly with Emscripten
        run: |
          mkdir -p wasm
          emcc src/main.c src/math_utils.c src/budget.c src/prediction.c src/encryption.c src/simulator.c \
            -O3 \
            -s WASM=1 \
            -s STANDALONE_WASM=1 \
            --no-entry \
            -o wasm/securesave.wasm
          python3 tools/generate_js_loader.py
          ls -la wasm/

      - name: Run WebAssembly Unit & Integration Tests
        run: |
          node tools/test_wasm.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
